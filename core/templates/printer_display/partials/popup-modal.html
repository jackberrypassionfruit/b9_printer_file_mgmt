<div class="flex items-center justify-center fixed z-10 w-4/5 h-full left-[10%] top-0" role="dialog"

    <div class="flex flex-row justify-between items-center gap-60 bg-white rounded-lg max-w-[800px] p-8 m-auto">
        <div class="card flex flex-col items-center w-full">
            <div class="card-title">File Bank</div>
            <div class="card-body w-full">
                <ul id="file-bank" class="w-full border-2 border-dashed"></ul>
            </div>
        </div>
        <div>
            <div class="flex flex-row items-center justify-between border-b-2 border-black">
                <h3 x-text="selected_printer" class="text-2xl font-bold"></h3>
                <a aria-label="Close" x-on:click="isModalOpen = false">✖</a>
            </div>
            <div id="files-this-printer-target" class="my-4"></div>
        </div>
    </div>

<div class="w-full h-full fixed top-0 left-0 bg-black opacity-75" x-show="isModalOpen" x-cloak></div>
